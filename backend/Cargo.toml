[package]
name = "interview-guide-backend"
version = "2.0.0"
edition = "2021"
authors = ["Platform Engineering <eng@interviewguide.internal>"]
description = "High-performance Rust backend for Interview Guide Platform"

[dependencies]
axum = { version = "0.7.5", features = ["macros"] }
tokio = { version = "1.38.0", features = ["full"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
tower = { version = "0.4.13", features = ["util"] }
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
utoipa = { version = "4.2.3", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "7.1.0", features = ["axum"] }
sqlx = { version = "0.7.4", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"], default-features = false }
uuid = { version = "1.8.0", features = ["serde", "v4"] }
chrono = { version = "0.4.38", features = ["serde"] }
metrics = "0.23.0"
metrics-exporter-prometheus = "0.15.0"
rand = "0.8.5"
regex = "1.10.5"
sha2 = "0.10.8"
jsonwebtoken = "9.3"
bcrypt = "0.15"
hex = "0.4"
base64 = "0.22"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }


[dev-dependencies]
tower = { version = "0.4.13", features = ["util"] }
http-body-util = "0.1.2"
