replicaCount: 3

image:
  repository: ghcr.io/company/interview-guide
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: "interview-guide-sa"

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: interview.company.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: interview-tls
      hosts:
        - interview.company.com

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

env:
  NODE_ENV: "production"
  DATABASE_URL_SECRET_NAME: "remote-postgres-secret"

probes:
  liveness:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
