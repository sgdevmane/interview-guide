version: '3.8'

# ==============================================================================
# Production Docker Compose - High Availability Cluster Architecture
# Nginx Load Balancer fronting 2 Web Instances and 2 Rust Backend Instances
# Avoids common host ports (uses 9443 for public web/API, 9191 for Prometheus, 9292 for Grafana)
# Retrieves remote PostgreSQL configuration from .env.production
# ==============================================================================

services:
  # Production Nginx Reverse Proxy & Load Balancer
  nginx-lb:
    image: nginx:alpine
    container_name: interview-guide-nginx-lb-prod
    restart: always
    ports:
      - "${PROD_PORT:-9443}:80"
    volumes:
      - ./docker/nginx-prod-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-1
      - web-2
      - backend-1
      - backend-2
    networks:
      - production-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Web Frontend Instance 1
  web-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: interview-guide-web-prod-1
    restart: always
    networks:
      - production-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Web Frontend Instance 2
  web-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: interview-guide-web-prod-2
    restart: always
    networks:
      - production-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Rust High-Performance Backend Instance 1
  backend-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: interview-guide-backend-prod-1
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - MARKDOWNS_DIR=/app/markdowns
    networks:
      - production-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Rust High-Performance Backend Instance 2
  backend-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: interview-guide-backend-prod-2
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - MARKDOWNS_DIR=/app/markdowns
    networks:
      - production-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # High-Performance Cache & Distributed Rate Limiting (Item #1 & #41)
  redis:
    image: redis:7.2-alpine
    container_name: interview-guide-redis-prod
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    ports:
      - "${REDIS_PORT:-9379}:6379"
    networks:
      - production-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer Connection Pooler Fronting Remote PostgreSQL (Item #2)
  pgbouncer:
    image: edoburu/pgbouncer:v1.22.1
    container_name: interview-guide-pgbouncer-prod
    restart: always
    environment:
      - DB_USER=${DB_USER:-sterlingpixel}
      - DB_PASSWORD=${DB_PASSWORD:-XspSmTGPxBeRhG84}
      - DB_HOST=${DB_HOST:-213.199.39.44}
      - DB_PORT=${DB_PORT:-35432}
      - DB_NAME=${DB_NAME:-interview_staging}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=25
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - SERVER_RESET_QUERY=DISCARD ALL
    ports:
      - "${PGBOUNCER_PORT:-9432}:5432"
    networks:
      - production-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Observability - Prometheus
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: interview-guide-prometheus-prod
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "${PROMETHEUS_PORT:-9191}:9090"
    networks:
      - production-network

  # Observability - Grafana Dashboard
  grafana:
    image: grafana/grafana:10.3.3
    container_name: interview-guide-grafana-prod
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=prod_secure_grafana_pass
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_prod_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-9292}:3000"
    depends_on:
      - prometheus
    networks:
      - production-network

networks:
  production-network:
    driver: bridge

volumes:
  prometheus_prod_data:
  grafana_prod_data:
  redis_prod_data:
