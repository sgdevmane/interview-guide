version: '3.8'

# ==============================================================================
# Staging Docker Compose - Production-Parity Staging Environment
# Retrieves remote PostgreSQL configuration from .env.staging
# Non-standard host ports avoiding common 3000, 8000, 8080
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: interview-guide-staging
    restart: always
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=staging
      - DATABASE_URL=${DATABASE_URL}
      - PORT=8080
      - MARKDOWNS_DIR=/app/markdowns
    ports:
      - "${STAGING_PORT:-9442}:8080"
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: interview-guide-prometheus-staging
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_staging_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "${PROMETHEUS_PORT:-9190}:9090"
    networks:
      - staging-network

  grafana:
    image: grafana/grafana:10.3.3
    container_name: interview-guide-grafana-staging
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=staging_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_staging_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-9291}:3000"
    depends_on:
      - prometheus
    networks:
      - staging-network

networks:
  staging-network:
    driver: bridge

volumes:
  prometheus_staging_data:
  grafana_staging_data:
