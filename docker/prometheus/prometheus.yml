global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'interview-guide-app'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']
        labels:
          environment: '${NODE_ENV:-production}'
          service: 'interview-guide'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
