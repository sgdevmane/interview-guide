global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'interview-guide-backend'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend-1:8080', 'backend-2:8080', 'app:8080']
        labels:
          service: 'interview-guide-backend'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
